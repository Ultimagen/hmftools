name: Build gripss Docker image

# Builds gripss from this branch with the shared ugbio-utils workflow: the image is scanned for
# vulnerabilities (reported, not blocking) before it is pushed.
# gripss is built from gripss-v2.4.0_ultima (upstream master moved gripss into esvee).

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Docker image tag. If omitted: gripss-v2.4.0_ultima_<sha> on gripss-v2.4.0_ultima, test_<sha> on other branches"
        required: false
        type: string

permissions:
  id-token: write # Required for assuming an AWS role
  contents: read # Required for actions/checkout

jobs:

  build:
    uses: Ultimagen/ugbio-utils/.github/workflows/docker-build-push.yml@main
    secrets: inherit
    with:
      git-repo: ${{ github.repository }}
      git-ref: ${{ github.ref_name }}
      docker-image: gripss
      docker-file: gripss/Dockerfile
      docker-tag: ${{ inputs.image-tag }}
      base-branch: gripss-v2.4.0_ultima
