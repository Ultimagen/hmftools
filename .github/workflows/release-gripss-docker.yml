name: Release and Build gripss Docker image

# Bumps the version from the latest semver git tag, builds and scans the image
# (gripss:<version>_<sha> and gripss:<version>), then pushes the git tag.
# Run it on gripss-v2.4.0_ultima (upstream master moved gripss into esvee).

on:
  workflow_dispatch:
    inputs:
      minor-release:
        description: "Is this a minor release?"
        type: boolean
        required: false
        default: false
      create-release:
        description: "Create a GitHub Release?"
        type: boolean
        required: false
        default: false

permissions:
  id-token: write
  contents: write

jobs:
  release-and-build:
    uses: Ultimagen/ugbio-utils/.github/workflows/release-and-build-docker.yml@main
    secrets: inherit
    with:
      docker-image: gripss
      docker-file: gripss/Dockerfile
      base-branch: gripss-v2.4.0_ultima
      minor-release: ${{ inputs.minor-release }}
      create-release: ${{ inputs.create-release }}
